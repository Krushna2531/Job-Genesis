name: frontend
description: "JobGenesis — Full-stack job platform. Crawl, track, interview, hire."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.1.0

  # Fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1

  # Charts / Gauges
  fl_chart: ^0.70.2

  # Visual Effects
  shimmer: ^3.0.0
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  flutter_dotenv: ^6.0.0
  flutter_screenutil: ^5.9.3
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
